<style>
/* Layout: single-column drill console; Dutch road-sign blue header band, asphalt-grey surfaces, amber priority-diamond accents */
:root{
  --bg:#EDF0F3;--surface:#FFFFFF;--ink:#15202B;--muted:#5A6675;--line:#D4DAE1;
  --blue:#1F4FA0;--blue-ink:#FFFFFF;--amber:#F2B300;--ok:#1E8A4C;--ok-bg:#E3F3EA;--bad:#C8322B;--bad-bg:#FBE7E5;
  --road:#4A525C;--grass:#CFDDC4;--sand:#C9AE7E;--veh:#E07B24;--bike:#16806B;--moped:#8A4FB8;--tram:#B88A00;--rail:#2E343B;
  --display:"Overpass","Arial Narrow",Arial,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1419;--surface:#18212A;--ink:#E6EBF0;--muted:#97A3B0;--line:#2B3644;
  --blue:#2E5FB8;--blue-ink:#FFFFFF;--amber:#F4C33A;--ok:#4CC27E;--ok-bg:#16301F;--bad:#F06A61;--bad-bg:#3A1A18;
  --road:#3A434E;--grass:#22321F;--sand:#7A6544;--veh:#E88B3A;--bike:#2FB394;--moped:#A774D6;--tram:#D6A92A;--rail:#1A1F25;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1419;--surface:#18212A;--ink:#E6EBF0;--muted:#97A3B0;--line:#2B3644;
  --blue:#2E5FB8;--blue-ink:#FFFFFF;--amber:#F4C33A;--ok:#4CC27E;--ok-bg:#16301F;--bad:#F06A61;--bad-bg:#3A1A18;
  --road:#3A434E;--grass:#22321F;--sand:#7A6544;--veh:#E88B3A;--bike:#2FB394;--moped:#A774D6;--tram:#D6A92A;--rail:#1A1F25;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blue);color:var(--blue-ink)}
.hin,.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hin{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{font-family:var(--display);font-weight:900;font-size:1.25rem;flex:1;cursor:pointer;display:flex;align-items:center;gap:10px}
.dia{width:20px;height:20px;background:var(--amber);transform:rotate(45deg);border:3px solid #fff;flex:none}
.hstat{font-family:var(--display);font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem;font-weight:900}h2{font-size:1.2rem;font-weight:800}
.lbl{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.88rem;margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.qpanel{display:flex;flex-direction:column;gap:14px}
.ready{display:flex;gap:18px;align-items:center}
.gauge{font-family:var(--display);font-weight:900;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.gauge small{font-size:1.2rem}
.daily{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:center;margin-top:8px;font-size:.85rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar.lo>i{background:var(--bad)}.bar.mid>i{background:var(--amber)}.bar.hi>i{background:var(--ok)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.modes{grid-template-columns:1fr}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode b{font-family:var(--display);font-weight:800;font-size:1.05rem}
.mode span{font-size:.88rem;color:var(--muted)}
.mode.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);grid-column:1/-1}
.mode.primary span{color:var(--blue-ink);opacity:.88}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.55;cursor:default}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 100px 44px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.trow:last-child{border-bottom:0}
.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.chip{display:inline-block;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--amber);color:#1a1400;padding:3px 8px;border-radius:3px}
.chip.again{background:var(--bad);color:#fff}
.qtext{font-size:1.2rem;font-weight:700;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:13px 14px;font-size:1rem;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:var(--display);font-weight:900;color:var(--muted);flex:none;width:1.1em}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.hz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hz .opt{justify-content:center;text-align:center;font-weight:700;font-size:.95rem}
.num{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num input{font:inherit;font-size:1.3rem;font-weight:700;width:140px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:10px;padding:12px 18px;font-family:var(--display);font-weight:800;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{border-radius:10px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb h3{font-size:1.05rem;margin-bottom:4px}
.lesson{border:2px dashed var(--amber);border-radius:10px;padding:14px 16px}
.lesson ul,details ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.scene{width:100%;max-width:300px;display:block;margin:0 auto;border-radius:10px}
.sign{width:120px;height:120px;display:block;margin:4px auto}
.revsvg .scene{max-width:180px;margin:8px 0}.revsvg .sign{width:72px;height:72px;margin:8px 0}
.revq{font-weight:700;margin:8px 0 4px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px}
details{border-bottom:1px solid var(--line);padding:12px 0}
details:last-child{border-bottom:0}
details .btn{margin-top:10px}
summary{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
.rev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.big{font-family:var(--display);font-weight:900;font-size:2.6rem;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)}.fail{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt,.mode{transition:border-color .15s,background .15s}}
</style>
</head><body>

  <div class="logo" id="home" role="button" tabindex="0"><span class="dia"></span>Theory Drill NL</div>
  <div class="hstat" id="hstat"></div>
</div></header>
<main class="wrap" id="app"></main>

overtake:["Overtake on the left. Trams are overtaken on the right, unless that is impossible.","Overtaking on the right is allowed in slow parallel queues, or when the vehicle ahead is turning left.","Mirrors, blind spot, signal, then go.","Never cross a continuous line to overtake.","Being overtaken: keep right and don't speed up.","Give cyclists plenty of sideways space."],
people:["Pedestrians on, or about to step onto, a zebra crossing: let them cross.","Blind pedestrians (white cane or guide dog): always let them pass.","Children are unpredictable. Slow down near schools, playgrounds and parked cars.","Turning right: check your mirror and blind spot for cyclists.","Cyclists may ride two abreast if they don't obstruct traffic.","Fietsstraat with 'auto te gast': the car is a guest.","Open your door with the far hand so you look back (the Dutch reach)."],
hazard:["CBR hazard questions have three answers: Brake, Release accelerator, Do nothing.","Brake: the danger is real and close. You must slow down now.","Release accelerator: something could develop. Anticipate and lose some speed.","Do nothing: no danger and no reason to slow down. Braking without reason is also wrong.","Look far ahead, check your mirrors and watch what others are about to do."],

function inst(p,pi){
 let q;
 if(p.fam){const i=pi??Math.floor(Math.random()*p.fam.params.length);q={...p,...p.fam.make(p.fam.params[i]),pi:i}}
 else q={...p};
 if(q.o&&(q.shuffle||(q.o.length>2&&q.t!=="hazard"))){

 }

}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rec=id=>S.q[id]||(S.q[id]={b:0,s:0,w:0,l:-99});
const acc=t=>{const a=S.t[t]||[];return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if((S.days[k]||0)>0){n++;d.setDate(d.getDate()-1)}else break}return n}
function mastery(t){
 const qs=byTopic(t),cov=qs.filter(p=>S.q[p.id]&&S.q[p.id].b>=1).length/qs.length,a=acc(t);
 return a==null?0:a*Math.min(1,cov*1.4);
}
const readiness=()=>Math.round(Object.keys(TOPICS).reduce((s,t)=>s+mastery(t),0)/Object.keys(TOPICS).length*100);
function record(q,ok){
 const r=rec(q.id);r.s++;r.l=S.tick;S.tick++;
 if(ok)r.b=Math.min(5,r.b+1);else{r.b=0;r.w++;S.relearn=S.relearn.filter(x=>x.id!==q.id);S.relearn.push({id:q.id,pi:q.pi,due:S.tick+3+Math.floor(Math.random()*3)})}
 (S.t[q.t]=S.t[q.t]||[]).push(ok?1:0);if(S.t[q.t].length>15)S.t[q.t].shift();
 const d=today();S.days[d]=(S.days[d]||0)+1;
 save();
}
function pick(pool,lastId){
 const due=S.relearn.find(r=>r.due<=S.tick&&r.id!==lastId&&pool.some(p=>p.id===r.id));
 if(due){S.relearn=S.relearn.filter(r=>r!==due);return [pool.find(p=>p.id===due.id),due.pi]}
 let tot=0;const ws=pool.map(p=>{
  const r=S.q[p.id];const base=!r||!r.s?2.2:[4,2.5,1.4,.8,.4,.2][r.b];
  const a=acc(p.t);const tf=1+3*(1-(a==null?.5:a));
  const fresh=p.id===lastId?0:(r&&S.tick-r.l<(p.fam?2:6)?.04:1);
  const w=base*tf*fresh*(p.fam?4:1);tot+=w;return w});
 let x=Math.random()*tot;for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return [pool[i]]}
 return [pool[pool.length-1]];
}

function answer(v){
 const q=sess.cur,ok=isRight(q,v);
 record(q,ok);
 if(sess.exam){sess.res.push({q,ok,v});sess.i++;if(sess.i>=sess.qs.length)return finishExam();sess.cur=inst(sess.qs[sess.i]);return render(sess.cur)}
 sess.n++;if(ok)sess.ok++;else sess.missedT[q.t]=(sess.missedT[q.t]||0)+1;head();
 if(q.o)app.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.a)b.classList.add("ok");else if(i===v)b.classList.add("bad")});
 else{document.getElementById("numin").disabled=true;document.querySelector("#nf .btn").remove()}
 const right=q.o?q.o[q.a]:`${fmt(q.a)} ${q.u||""}`;
 let lesson="";
 if(!ok){const a=acc(q.t),n=(S.t[q.t]||[]).length;
  if(n>=3&&a<.6&&S.tick-(S.lessonAt[q.t]??-99)>12){S.lessonAt[q.t]=S.tick;save();
   lesson=`<div class="lesson"><div class="lbl">${U.quick(TOPICS[q.t])}</div><div class="muted small">${U.quickD}</div><ul>${LESSONS[q.t].map(x=>`<li>${x}</li>`).join("")}</ul></div>`}}
 document.getElementById("after").innerHTML=`<div class="stack">
  <div class="fb ${ok?"":"bad"}"><h3>${ok?U.correct:U.wrong(right)}</h3><div>${q.e}</div></div>
  ${lesson}
  <div class="row"><button class="btn" id="nx">${U.next}</button>${!ok&&!lesson?`<button class="btn ghost" id="lt">${U.rulesFor(TOPICS[q.t])}</button>`:""}</div></div>`;
 const nx=document.getElementById("nx");nx.onclick=next;
 const lt=document.getElementById("lt");if(lt)lt.onclick=()=>{lt.outerHTML=`<div class="lesson" style="width:100%"><div class="lbl">${TOPICS[q.t]}</div><ul>${LESSONS[q.t].map(x=>`<li>${x}</li>`).join("")}</ul></div>`};
 document.getElementById("after").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function summary(){
 if(!sess||!sess.n)return home();
 hstat.textContent="";
 const weak=Object.entries(sess.missedT).sort((a,b)=>b[1]-a[1]);
 H(`<section class="panel stack">
  <div class="lbl">${U.done}</div><div class="big">${sess.ok} / ${sess.n}</div>
  ${weak.length?`<div>${U.mostMissed}${weak.slice(0,3).map(([t,c])=>`<b>${TOPICS[t]}</b> (${c})`).join(", ")}. ${U.moreOften}</div>`:`<div>${U.noMiss}</div>`}
  <div class="row"><button class="btn" id="again">${U.keep}</button><button class="btn ghost" id="hm">${U.overview}</button></div></section>`);
 const m=sess.mode;
 document.getElementById("again").onclick=()=>go(m==="weak"&&!mistakes().length?"smart":m);
 document.getElementById("hm").onclick=home;
}
function learn(){
 hstat.textContent="";
 H(`<h1>${U.learnH}</h1><p class="muted" style="margin:0">${U.learnP}</p>
 <section class="panel">${Object.keys(TOPICS).sort((a,b)=>mastery(a)-mastery(b)).map(t=>{const v=mastery(t);return `<details><summary><span>${TOPICS[t]}</span><div class="bar ${cls(v)}"><i style="width:${pct(v)}"></i></div><span class="pct">${pct(v)}</span></summary><ul>${LESSONS[t].map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn" data-t="${t}">${U.drill(TOPICS[t])}</button></details>`}).join("")}</section>
 <div><button class="btn ghost" id="hm">${U.back}</button></div>`);
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go("topic:"+b.dataset.t));
 document.getElementById("hm").onclick=home;
}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function startExam(){
 let qs=[];
 for(const[t,n]of Object.entries(EXAM_MIX)){
  const fams=byTopic(t).filter(p=>p.fam),hand=shuf(byTopic(t).filter(p=>!p.fam));
  const nf=fams.length?Math.min(Math.ceil(n/3),n):0;
  const g=Array.from({length:nf},()=>fams[Math.floor(Math.random()*fams.length)]);
  qs.push(...g,...hand.slice(0,n-nf));
 }
 qs=shuf(qs);
 sess={exam:true,qs,i:0,res:[]};sess.cur=inst(qs[0]);render(sess.cur);
}
function finishExam(){
 const res=sess.res,score=res.filter(r=>r.ok).length,done=res.length;
 if(done===50){S.exams.push(score);save()}
 hstat.textContent="";
 const wrong=res.filter(r=>!r.ok);
 const verdict=done<50?`<div class="muted">${U.stopped(done)}</div>`:score>=TARGET?`<div class="pass">${U.passMargin}</div>`:score>=PASS?`<div class="pass">${U.passLow(TARGET)}</div>`:`<div class="fail">${U.fail(PASS)}</div>`;
 const ans=(q,v)=>q.o?q.o[v]:fmt(v)+" "+(q.u||"");
 H(`<section class="panel stack">
  <div class="lbl">${U.result}</div><div class="big ${score>=PASS&&done===50?"pass":"fail"}">${score} / ${done||50}</div>${verdict}
  <div class="row"><button class="btn" id="fx" ${wrong.length?"":"disabled"}>${U.fix}</button><button class="btn ghost" id="hm">${U.overview}</button></div></section>
 ${wrong.length?`<section class="panel"><h2>${U.review}</h2>${wrong.map(r=>`<div class="rev"><span class="chip">${TOPICS[r.q.t]}</span>${r.q.svg?`<div class="revsvg">${r.q.svg}</div>`:""}<p class="revq">${r.q.q}</p><div>${U.yours}<span class="fail">${ans(r.q,r.v)}</span> · ${U.right}<span class="pass">${ans(r.q,r.q.a)}</span></div><div class="muted" style="margin-top:4px">${r.q.e}</div></div>`).join("")}</section>`:""}`);
 document.getElementById("hm").onclick=home;
 const fx=document.getElementById("fx");if(fx)fx.onclick=()=>go("weak");
 sess=null;
}
const hb=document.getElementById("home");hb.onclick=home;hb.onkeydown=e=>{if(e.key==="Enter")home()};
document.documentElement.lang=STR.lang;
home();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")&&!location.hostname.includes("claudeusercontent")){
 navigator.serviceWorker.register("sw.js").catch(()=>{});
}

</script>

</body></html>

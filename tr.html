<style>
/* Layout: single-column drill console; Dutch road-sign blue header band, asphalt-grey surfaces, amber priority-diamond accents */
:root{
  --bg:#EDF0F3;--surface:#FFFFFF;--ink:#15202B;--muted:#5A6675;--line:#D4DAE1;
  --blue:#1F4FA0;--blue-ink:#FFFFFF;--amber:#F2B300;--ok:#1E8A4C;--ok-bg:#E3F3EA;--bad:#C8322B;--bad-bg:#FBE7E5;
  --road:#4A525C;--grass:#CFDDC4;--sand:#C9AE7E;--veh:#E07B24;--bike:#16806B;--moped:#8A4FB8;--tram:#B88A00;--rail:#2E343B;
  --display:"Overpass","Arial Narrow",Arial,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1419;--surface:#18212A;--ink:#E6EBF0;--muted:#97A3B0;--line:#2B3644;
  --blue:#2E5FB8;--blue-ink:#FFFFFF;--amber:#F4C33A;--ok:#4CC27E;--ok-bg:#16301F;--bad:#F06A61;--bad-bg:#3A1A18;
  --road:#3A434E;--grass:#22321F;--sand:#7A6544;--veh:#E88B3A;--bike:#2FB394;--moped:#A774D6;--tram:#D6A92A;--rail:#1A1F25;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1419;--surface:#18212A;--ink:#E6EBF0;--muted:#97A3B0;--line:#2B3644;
  --blue:#2E5FB8;--blue-ink:#FFFFFF;--amber:#F4C33A;--ok:#4CC27E;--ok-bg:#16301F;--bad:#F06A61;--bad-bg:#3A1A18;
  --road:#3A434E;--grass:#22321F;--sand:#7A6544;--veh:#E88B3A;--bike:#2FB394;--moped:#A774D6;--tram:#D6A92A;--rail:#1A1F25;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blue);color:var(--blue-ink)}
.hin,.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hin{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{font-family:var(--display);font-weight:900;font-size:1.25rem;flex:1;cursor:pointer;display:flex;align-items:center;gap:10px}
.dia{width:20px;height:20px;background:var(--amber);transform:rotate(45deg);border:3px solid #fff;flex:none}
.hstat{font-family:var(--display);font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem;font-weight:900}h2{font-size:1.2rem;font-weight:800}
.lbl{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.88rem;margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.qpanel{display:flex;flex-direction:column;gap:14px}
.ready{display:flex;gap:18px;align-items:center}
.gauge{font-family:var(--display);font-weight:900;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.gauge small{font-size:1.2rem}
.daily{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:center;margin-top:8px;font-size:.85rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar.lo>i{background:var(--bad)}.bar.mid>i{background:var(--amber)}.bar.hi>i{background:var(--ok)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.modes{grid-template-columns:1fr}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode b{font-family:var(--display);font-weight:800;font-size:1.05rem}
.mode span{font-size:.88rem;color:var(--muted)}
.mode.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);grid-column:1/-1}
.mode.primary span{color:var(--blue-ink);opacity:.88}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.55;cursor:default}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 100px 44px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.trow:last-child{border-bottom:0}
.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.chip{display:inline-block;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--amber);color:#1a1400;padding:3px 8px;border-radius:3px}
.chip.again{background:var(--bad);color:#fff}
.qtext{font-size:1.2rem;font-weight:700;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:13px 14px;font-size:1rem;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:var(--display);font-weight:900;color:var(--muted);flex:none;width:1.1em}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.hz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hz .opt{justify-content:center;text-align:center;font-weight:700;font-size:.95rem}
.num{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num input{font:inherit;font-size:1.3rem;font-weight:700;width:140px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:10px;padding:12px 18px;font-family:var(--display);font-weight:800;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{border-radius:10px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb h3{font-size:1.05rem;margin-bottom:4px}
.lesson{border:2px dashed var(--amber);border-radius:10px;padding:14px 16px}
.lesson ul,details ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.scene{width:100%;max-width:300px;display:block;margin:0 auto;border-radius:10px}
.sign{width:120px;height:120px;display:block;margin:4px auto}
.revsvg .scene{max-width:180px;margin:8px 0}.revsvg .sign{width:72px;height:72px;margin:8px 0}
.revq{font-weight:700;margin:8px 0 4px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px}
details{border-bottom:1px solid var(--line);padding:12px 0}
details:last-child{border-bottom:0}
details .btn{margin-top:10px}
summary{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
.rev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.big{font-family:var(--display);font-weight:900;font-size:2.6rem;font-variant-numeric:tabular-nums}
.langs .btn{text-decoration:none;font-size:.9rem;padding:8px 14px}
.pass{color:var(--ok)}.fail{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt,.mode{transition:border-color .15s,background .15s}}
</style>
</head><body>

priority:["Eşit kavşak: sağdan gelene yol ver; bisikletliler ve mopetliler de dahil.","Tramvaylar eşit kavşaklarda soldan gelseler bile geçiş üstünlüğüne sahiptir (tramvayın yolunda köpek dişi yoksa).","Toprak yoldan asfalt yola çıkarken toprak yol yol verir.","Çıkış yolundan, erf'ten veya otoparktan çıkarken, kalkışta, geri giderken, U dönüşünde veya şerit değiştirirken herkese yol ver.","Köpek dişleri, ters üçgen veya STOP: iki yönden gelen trafiğe yol ver.","Dönen trafik, aynı yolda düz giden trafiğe (yanındaki bisikletliler dahil) yol verir.","Sıralama: trafik görevlisi, sonra trafik ışıkları, sonra işaretler, sonra genel kurallar.","Mavi tepe lambası ve siren birlikte: yol aç."],
signs:["Kırmızı daire: yasak. Mavi daire: zorunluluk. Kırmızı üçgen: uyarı. Mavi dikdörtgen: bilgi.","Beyaz yatay çubuklu kırmızı daire: girilmez. Kırmızı kenarlı beyaz daire: iki yönde tüm araçlara kapalı.","Kırmızı kenarlı, tek çizgili mavi daire: park yasağı. Kırmızı çarpılı: durma yasağı.","Turuncu-sarı baklava: ana yol (öncelikli yol). Üzerinde siyah çizgi: ana yolun sonu.","Düz beyaz çizgi: geçilmez. Kesik çizgi: geçilebilir. Taralı alan: üzerinden geçilmez.","Kaldırım kenarında düz sarı çizgi: durma yasağı. Kesik sarı çizgi: park yasağı. Yol çalışmasındaki sarı çizgiler beyazlardan önce gelir."],
parking:["Durmak, kısa süreliğine yolcu indirip bindirmek ya da hemen yük indirip yüklemektir. Gerisi park etmektir.","Kavşağa 5 m'den yakın park edilmez.","Bisiklet yolunda, yaya geçidinde veya hemzemin geçitte asla durma.","Otoyolda yalnızca acil durumda durabilirsin.","Mavi bölge: park diskini koy.","Çıkış yolunun önüne, otobüs durağına veya kartın yoksa engelli yerine park etme."],
motorway:["Yalnızca 60 km/s'den hızlı gidebilen ve gitmesine izin verilen araçlar girebilir.","Hızlanma şeridinde trafiğin hızına ulaş. Otoyoldaki trafiğin önceliği vardır.","Sağda kal. Soldan sollama yap.","Şeridin üstünde kırmızı çarpı: şerit kapalı. Çapraz ok: diğer şeride geç.","Çıkışı mı kaçırdın? Bir sonrakine kadar devam et. Asla geri gitme veya dönme.","Şerit yavaş trafikte bitiyorsa: şeridin sonunda fermuar sistemiyle birleş.","Arıza: emniyet şeridi, dörtlüler, herkes bariyerin arkasına, yardım çağır."],
overtake:["Soldan sollanır. Tramvaylar, mümkün değilse hariç, sağdan sollanır.","Yavaş, paralel kuyruklarda veya öndeki araç sola dönüyorsa sağdan geçmek serbesttir.","Aynalar, kör nokta, sinyal, sonra hareket.","Sollamak için asla düz çizgiyi geçme.","Seni solluyorlarsa: sağda kal ve hızlanma.","Bisikletlilere yandan bol mesafe bırak."],
people:["Yaya geçidinde ya da geçide adım atmak üzere olan yayalara geçiş ver.","Görme engelli yayalar (beyaz baston veya rehber köpek): her zaman geçmelerine izin ver.","Çocuklar öngörülemez. Okul, oyun alanı ve park etmiş araçların yanında yavaşla.","Sağa dönerken bisikletliler için aynanı ve kör noktanı kontrol et.","Bisikletliler trafiği engellemedikleri sürece yan yana iki kişi gidebilir.","'Auto te gast' yazan bisiklet sokağı: araba misafirdir.","Kapını uzaktaki elinle aç ki arkana bakmış ol (Dutch reach)."],
hazard:["CBR tehlike sorularında üç cevap vardır: Fren yap, Gazı bırak, Hiçbir şey yapma.","Fren yap: tehlike gerçek ve yakın. Şimdi yavaşlamalısın.","Gazı bırak: bir şey gelişebilir. Öngör ve biraz hız kaybet.","Hiçbir şey yapma: tehlike yok, yavaşlamak için sebep yok. Sebepsiz fren de yanlıştır.","Uzağa bak, aynalarını kontrol et ve diğerlerinin ne yapmak üzere olduğunu izle."],
safety:["Alkol sınırı: ‰0,5. Yeni sürücüler (ehliyetin ilk 5 yılı): ‰0,2.","Sürüş sırasında telefonu elde tutmak yasaktır; kırmızı ışıkta beklerken de.","Herkes kemer takar. 1,35 m'den kısa çocuklar uygun çocuk koltuğunda oturur.","Sarı uyarı etiketli ilaçlar sürüşünü etkileyebilir.","Uzun yolda yaklaşık her 2 saatte bir mola ver.","Kaza: olay yerini güvenli hâle getir, 112'yi ara, yardım et. Kazadan sonra asla devam edip gitme."],

const ARMPOS={S:[170,245,0,[200,250]],N:[130,55,180,[100,50]],E:[245,130,-90,[250,98]],W:[55,170,90,[50,204]]};

const rotP=(x,y,k)=>{for(let i=0;i<k;i++)[x,y]=[300-y,x];return[x,y]};
function vehSVG(v,k){
 const [x0,y0,r0,lp0]=ARMPOS[v.arm],[x,y]=rotP(x0,y0,k),[lx,ly]=rotP(lp0[0],lp0[1],k),r=r0+90*k;
 const c=v.you?"var(--blue)":({bike:"var(--bike)",moped:"var(--moped)",tram:"var(--tram)"})[v.kind]||"var(--veh)";
 let body,len=24;
 if(v.kind==="bike"||v.kind==="moped")body=`<rect x="-3.5" y="-15" width="7" height="30" rx="3.5" fill="${c}"/><circle r="6.5" fill="${c}"/>`;
 else if(v.kind==="tram"){body=`<rect x="-12" y="-44" width="24" height="88" rx="6" fill="${c}"/><rect x="-9" y="-38" width="18" height="9" rx="2" fill="#fff" opacity=".85"/>`;len=48}
 else body=`<rect x="-11" y="-19" width="22" height="38" rx="5" fill="${c}"/><rect x="-8" y="-12" width="16" height="8" rx="2" fill="#fff" opacity=".85"/>`;
 const path=v.turn==="L"?`M0,-${len} V-${len+20} Q0,-${len+34} -14,-${len+34} H-34 M-27,-${len+40} L-35,-${len+34} L-27,-${len+28}`
  :v.turn==="R"?`M0,-${len} V-${len+20} Q0,-${len+34} 14,-${len+34} H34 M27,-${len+40} L35,-${len+34} L27,-${len+28}`
  :`M0,-${len} V-${len+24} M-6,-${len+17} L0,-${len+25} L6,-${len+17}`;
 const arr=`<path d="${path}" stroke="${c}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
 const lab=v.you?`<circle r="16" fill="var(--surface)" stroke="${c}" stroke-width="2.5"/><text text-anchor="middle" dy="3.5" font-size="9" font-weight="800" fill="var(--ink)" font-family="Overpass,Arial,sans-serif">${STR.you}</text>`
  :`<circle r="12" fill="var(--surface)" stroke="${c}" stroke-width="2.5"/><text text-anchor="middle" dy="4.5" font-size="13" font-weight="800" fill="var(--ink)" font-family="Overpass,Arial,sans-serif">${v.l}</text>`;
 return `<g transform="translate(${x} ${y}) rotate(${r})">${body}${arr}</g><g transform="translate(${lx} ${ly})">${lab}</g>`;
}
function scene(o){
 const k=o.rot||0,d='stroke="#fff" stroke-width="2" stroke-dasharray="10 8"';
 const dash={N:[150,0,150,104],S:[150,196,150,300],W:[0,150,104,150],E:[196,150,300,150]};
 let g=`<rect width="300" height="300" fill="var(--grass)"/><rect x="110" width="80" height="300" fill="var(--road)"/><rect y="110" width="300" height="80" fill="var(--road)"/>`;
 (o.unpaved||[]).forEach(a=>{const r=ARMRECT[a];g+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="var(--sand)"/>`});
 Object.entries(dash).forEach(([a,c])=>{if(!(o.unpaved||[]).includes(a))g+=`<line x1="${c[0]}" y1="${c[1]}" x2="${c[2]}" y2="${c[3]}" ${d}/>`});
 if(o.rails)g+=`<line x1="0" y1="163" x2="300" y2="163" stroke="var(--rail)" stroke-width="2"/><line x1="0" y1="177" x2="300" y2="177" stroke="var(--rail)" stroke-width="2"/>`;
 (o.teeth||[]).forEach(a=>TEETH[a].forEach(p=>g+=`<polygon points="${p}" fill="#fff"/>`));
 if(o.diamond)g+=`<g transform="translate(222 222) rotate(45)"><rect x="-11" y="-11" width="22" height="22" fill="#fff" stroke="#333" stroke-width="1"/><rect x="-7" y="-7" width="14" height="14" fill="#F2B300"/></g>`;
 let s=`<svg viewBox="0 0 300 300" class="scene" role="img" aria-label="${STR.sceneAria}"><g transform="rotate(${90*k} 150 150)">${g}</g>`;
 o.v.forEach(v=>s+=vehSVG(v,k));
 return s+"</svg>";
}

const EXAM_MIX={priority:8,hazard:7,signs:5,speed:4,parking:4,motorway:4,overtake:3,people:4,safety:4,vehicle:4,rules:3};
const PASS=35,TARGET=44,DAILY=30;
const TOPICS=STR.topics,LESSONS=STR.lessons,U=STR.ui;
const POOL=[...QB.items,...GEN.map(g=>({id:g.id,t:g.t,fam:g}))];
const byTopic=t=>POOL.filter(p=>p.t===t);
function inst(p,pi){
 let q;
 if(p.fam){const i=pi??Math.floor(Math.random()*p.fam.params.length);q={...p,...p.fam.make(p.fam.params[i]),pi:i}}
 else q={...p};
 if(!q.svg&&PICMAP[q.id])q.svg=pic(PICMAP[q.id]);
 if(q.o&&(q.shuffle||(q.o.length>2&&q.t!=="hazard"))){
  const idx=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);
  q={...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)};
 }
 return q;
}

/* ---------- state ---------- */
const KEY="theory-drill-v2";
const blank=()=>({q:{},t:{},tick:0,relearn:[],lessonAt:{},exams:[],days:{}});
let S;try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=blank()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rec=id=>S.q[id]||(S.q[id]={b:0,s:0,w:0,l:-99});
const acc=t=>{const a=S.t[t]||[];return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if((S.days[k]||0)>0){n++;d.setDate(d.getDate()-1)}else break}return n}
function mastery(t){
 const qs=byTopic(t),cov=qs.filter(p=>S.q[p.id]&&S.q[p.id].b>=1).length/qs.length,a=acc(t);
 return a==null?0:a*Math.min(1,cov*1.4);
}
const readiness=()=>Math.round(Object.keys(TOPICS).reduce((s,t)=>s+mastery(t),0)/Object.keys(TOPICS).length*100);
function record(q,ok){
 const r=rec(q.id);r.s++;r.l=S.tick;S.tick++;
 if(ok)r.b=Math.min(5,r.b+1);else{r.b=0;r.w++;S.relearn=S.relearn.filter(x=>x.id!==q.id);S.relearn.push({id:q.id,pi:q.pi,due:S.tick+3+Math.floor(Math.random()*3)})}
 (S.t[q.t]=S.t[q.t]||[]).push(ok?1:0);if(S.t[q.t].length>15)S.t[q.t].shift();
 const d=today();S.days[d]=(S.days[d]||0)+1;
 save();
}
function pick(pool,lastId){
 const due=S.relearn.find(r=>r.due<=S.tick&&r.id!==lastId&&pool.some(p=>p.id===r.id));
 if(due){S.relearn=S.relearn.filter(r=>r!==due);return [pool.find(p=>p.id===due.id),due.pi]}
 let tot=0;const ws=pool.map(p=>{
  const r=S.q[p.id];const base=!r||!r.s?2.2:[4,2.5,1.4,.8,.4,.2][r.b];
  const a=acc(p.t);const tf=1+3*(1-(a==null?.5:a));
  const fresh=p.id===lastId?0:(r&&S.tick-r.l<(p.fam?2:6)?.04:1);
  const w=base*tf*fresh*(p.fam?4:1);tot+=w;return w});
 let x=Math.random()*tot;for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return [pool[i]]}
 return [pool[pool.length-1]];
}
const mistakes=()=>POOL.filter(p=>S.q[p.id]&&S.q[p.id].w>0&&S.q[p.id].b<3);

/* ---------- views ---------- */
const app=document.getElementById("app"),hstat=document.getElementById("hstat");
let sess=null;
const cls=v=>v<.5?"lo":v<.8?"mid":"hi";
const pct=v=>Math.round(v*100)+"%";
const H=(s)=>{app.innerHTML=s;window.scrollTo(0,0)};
const LANGS=[["en","English","./"],["nl","Nederlands","nl.html"],["tr","Türkçe","tr.html"]];
const langLinks=()=>/github\.io$|localhost/.test(location.hostname)?`<div class="row langs">${LANGS.filter(l=>l[0]!==STR.lang&&(window.AVAIL||["en"]).includes(l[0])).map(l=>`<a class="btn ghost" href="${l[2]}" lang="${l[0]}">${l[1]}</a>`).join("")}</div>`:"";
function home(){
 sess=null;hstat.textContent="";
 const rd=readiness(),m=mistakes().length,ans=Object.values(S.q).reduce((s,r)=>s+r.s,0);
 const last=S.exams[S.exams.length-1],td=S.days[today()]||0,st=streak();
 const rows=Object.entries(TOPICS).map(([t,n])=>{const v=mastery(t);return `<div class="trow"><span>${n}</span><div class="bar ${cls(v)}"><i style="width:${pct(v)}"></i></div><span class="pct">${pct(v)}</span></div>`}).join("");
 H(`
 <section class="panel ready">
  <div class="gauge">${rd}<small>%</small></div>
  <div style="min-width:0;flex:1"><div class="lbl">${U.readiness}</div>
  <div class="muted" style="font-size:.92rem">${ans?U.answers(ans)+(last!=null?U.lastExam(last):"")+". "+U.aim:U.start}</div>
  <div class="daily"><div class="bar ${td>=DAILY?"hi":""}"><i style="width:${Math.min(100,td/DAILY*100)}%"></i></div><span>${U.today(td,DAILY)}${U.streak(st)}</span></div></div>
 </section>
 <section class="modes">
  <button class="mode primary" data-go="smart"><b>${U.smart}</b><span>${U.smartD}</span></button>
  <button class="mode primary loop" data-go="loop"><b>${U.loop}</b><span>${U.loopD}</span></button>
  <button class="mode" data-go="weak" ${m?"":"disabled"}><b>${U.weak}</b><span>${U.weakD(m)}</span></button>
  <button class="mode" data-go="exam"><b>${U.exam}</b><span>${U.examD}</span></button>
  <button class="mode" data-go="scenes"><b>${U.scenes}</b><span>${U.scenesD}</span></button>
  <button class="mode" data-go="signs"><b>${U.signsM}</b><span>${U.signsD}</span></button>
  <button class="mode wide" data-go="learn"><b>${U.learn}</b><span>${U.learnD}</span></button>
 </section>
 <section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2>${U.topics}</h2><span class="lbl">${U.mastery}</span></div>${rows}</section>
 <p class="muted small">${U.bank(QB.items.length,genCount())}. ${U.install}</p>
 ${langLinks()}
 <p class="muted small">${U.disclaimer}</p>
 <div class="row"><button class="btn ghost" id="reset">${U.reset}</button></div>`);
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 const rs=document.getElementById("reset");rs.onclick=()=>{if(rs.dataset.c){S=blank();save();home()}else{rs.dataset.c=1;rs.textContent=U.resetSure;rs.className="btn warn"}};
}
function go(m){
 if(m==="learn")return learn();
 if(m==="exam")return startExam();
 let pool=POOL,label=U.smart;
 if(m==="weak"){pool=mistakes();label=U.weak;if(!pool.length)return home()}
 if(m==="scenes"){pool=POOL.filter(p=>p.fam&&p.t==="priority");label=U.scenes}
 if(m==="signs"){pool=POOL.filter(p=>p.t==="signs");label=U.signsM}
 if(m==="loop"){sess={mode:m,loop:shuf(POOL),li:0,round:1,label:U.loop,n:0,ok:0,missedT:{},last:null};return next()}
 if(m.startsWith("topic:")){const t=m.slice(6);pool=byTopic(t);label=TOPICS[t]}
 sess={mode:m,pool,label,n:0,ok:0,missedT:{},last:null};
 next();
}
function next(){
 if(sess.mode==="weak"){sess.pool=mistakes();if(!sess.pool.length)return summary()}
 if(sess.loop){if(sess.li>=sess.loop.length){sess.loop=shuf(POOL);sess.li=0;sess.round++}
  const p=sess.loop[sess.li++];sess.last=p.id;sess.cur=inst(p);return render(sess.cur,false)}
 const [p,pi]=pick(sess.pool,sess.last);sess.last=p.id;
 const again=S.q[p.id]&&S.q[p.id].w>0&&S.q[p.id].b===0;
 sess.cur=inst(p,pi);render(sess.cur,again);
}
function head(){hstat.textContent=sess.exam?U.examProg(sess.i+1):sess.loop?U.loopProg(sess.round,sess.li,sess.loop.length):U.counter(sess.ok,sess.n)}
function render(q,again){
 head();
 const opts=q.o?(q.t==="hazard"?`<div class="hz">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>`
  :`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join("")}</div>`)
  :`<form class="num" id="nf"><input id="numin" inputmode="decimal" autocomplete="off" placeholder="${U.answer}" aria-label="${U.answer}"><span class="muted">${q.u||""}</span><button class="btn">${U.check}</button></form>`;
 H(`
 <div class="prog"><span class="lbl">${sess.exam?U.exam:sess.label}</span><button class="btn ghost" id="quit">${sess.exam?U.stopExam:U.finish}</button></div>
 <section class="panel qpanel">
  <div class="row"><span class="chip">${TOPICS[q.t]}</span>${again?`<span class="chip again">${U.missed}</span>`:""}</div>
  ${q.svg||""}
  <div class="qtext">${q.t==="hazard"?U.whatDo:""}${q.q}</div>
  ${opts}
 </section><div id="after"></div>`);
 document.getElementById("quit").onclick=()=>sess.exam?finishExam():summary();
 if(q.o)app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 else{const f=document.getElementById("nf"),inp=document.getElementById("numin");f.onsubmit=e=>{e.preventDefault();const v=parseFloat(inp.value.replace(",","."));if(isNaN(v))return;answer(v)}}
}
const isRight=(q,v)=>q.o?v===q.a:Math.abs(v-q.a)<=(q.tol||1e-9);
const fmt=n=>String(n).replace(".",STR.lang==="en"?".":",");
function answer(v){
 const q=sess.cur,ok=isRight(q,v);
 record(q,ok);
 if(sess.exam){sess.res.push({q,ok,v});sess.i++;if(sess.i>=sess.qs.length)return finishExam();sess.cur=inst(sess.qs[sess.i]);return render(sess.cur)}
 sess.n++;if(ok)sess.ok++;else sess.missedT[q.t]=(sess.missedT[q.t]||0)+1;head();
 if(q.o)app.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.a)b.classList.add("ok");else if(i===v)b.classList.add("bad")});
 else{document.getElementById("numin").disabled=true;document.querySelector("#nf .btn").remove()}
 const right=q.o?q.o[q.a]:`${fmt(q.a)} ${q.u||""}`;
 let lesson="";
 if(!ok){const a=acc(q.t),n=(S.t[q.t]||[]).length;
  if(n>=3&&a<.6&&S.tick-(S.lessonAt[q.t]??-99)>12){S.lessonAt[q.t]=S.tick;save();
   lesson=`<div class="lesson"><div class="lbl">${U.quick(TOPICS[q.t])}</div><div class="muted small">${U.quickD}</div><ul>${LESSONS[q.t].map(x=>`<li>${x}</li>`).join("")}</ul></div>`}}
 document.getElementById("after").innerHTML=`<div class="stack">
  <div class="fb ${ok?"":"bad"}"><h3>${ok?U.correct:U.wrong(right)}</h3><div>${q.e}</div></div>
  ${lesson}
  <div class="row"><button class="btn" id="nx">${U.next}</button>${!ok&&!lesson?`<button class="btn ghost" id="lt">${U.rulesFor(TOPICS[q.t])}</button>`:""}</div></div>`;
 const nx=document.getElementById("nx");nx.onclick=next;
 const lt=document.getElementById("lt");if(lt)lt.onclick=()=>{lt.outerHTML=`<div class="lesson" style="width:100%"><div class="lbl">${TOPICS[q.t]}</div><ul>${LESSONS[q.t].map(x=>`<li>${x}</li>`).join("")}</ul></div>`};
 document.getElementById("after").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function summary(){
 if(!sess||!sess.n)return home();
 hstat.textContent="";
 const weak=Object.entries(sess.missedT).sort((a,b)=>b[1]-a[1]);
 H(`<section class="panel stack">
  <div class="lbl">${U.done}</div><div class="big">${sess.ok} / ${sess.n}</div>
  ${weak.length?`<div>${U.mostMissed}${weak.slice(0,3).map(([t,c])=>`<b>${TOPICS[t]}</b> (${c})`).join(", ")}. ${U.moreOften}</div>`:`<div>${U.noMiss}</div>`}
  <div class="row"><button class="btn" id="again">${U.keep}</button><button class="btn ghost" id="hm">${U.overview}</button></div></section>`);
 const m=sess.mode;
 document.getElementById("again").onclick=()=>go(m==="weak"&&!mistakes().length?"smart":m);
 document.getElementById("hm").onclick=home;
}
function learn(){
 hstat.textContent="";
 H(`<h1>${U.learnH}</h1><p class="muted" style="margin:0">${U.learnP}</p>
 <section class="panel">${Object.keys(TOPICS).sort((a,b)=>mastery(a)-mastery(b)).map(t=>{const v=mastery(t);return `<details><summary><span>${TOPICS[t]}</span><div class="bar ${cls(v)}"><i style="width:${pct(v)}"></i></div><span class="pct">${pct(v)}</span></summary><ul>${LESSONS[t].map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn" data-t="${t}">${U.drill(TOPICS[t])}</button></details>`}).join("")}</section>
 <div><button class="btn ghost" id="hm">${U.back}</button></div>`);
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go("topic:"+b.dataset.t));
 document.getElementById("hm").onclick=home;
}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function startExam(){
 let qs=[];
 for(const[t,n]of Object.entries(EXAM_MIX)){
  const fams=byTopic(t).filter(p=>p.fam),hand=shuf(byTopic(t).filter(p=>!p.fam));
  const nf=fams.length?Math.min(Math.ceil(n/3),n):0;
  const g=Array.from({length:nf},()=>fams[Math.floor(Math.random()*fams.length)]);
  qs.push(...g,...hand.slice(0,n-nf));
 }
 qs=shuf(qs);
 sess={exam:true,qs,i:0,res:[]};sess.cur=inst(qs[0]);render(sess.cur);
}
function finishExam(){
 const res=sess.res,score=res.filter(r=>r.ok).length,done=res.length;
 if(done===50){S.exams.push(score);save()}
 hstat.textContent="";
 const wrong=res.filter(r=>!r.ok);
 const verdict=done<50?`<div class="muted">${U.stopped(done)}</div>`:score>=TARGET?`<div class="pass">${U.passMargin}</div>`:score>=PASS?`<div class="pass">${U.passLow(TARGET)}</div>`:`<div class="fail">${U.fail(PASS)}</div>`;
 const ans=(q,v)=>q.o?q.o[v]:fmt(v)+" "+(q.u||"");
 H(`<section class="panel stack">
  <div class="lbl">${U.result}</div><div class="big ${score>=PASS&&done===50?"pass":"fail"}">${score} / ${done||50}</div>${verdict}
  <div class="row"><button class="btn" id="fx" ${wrong.length?"":"disabled"}>${U.fix}</button><button class="btn ghost" id="hm">${U.overview}</button></div></section>
 ${wrong.length?`<section class="panel"><h2>${U.review}</h2>${wrong.map(r=>`<div class="rev"><span class="chip">${TOPICS[r.q.t]}</span>${r.q.svg?`<div class="revsvg">${r.q.svg}</div>`:""}<p class="revq">${r.q.q}</p><div>${U.yours}<span class="fail">${ans(r.q,r.v)}</span> · ${U.right}<span class="pass">${ans(r.q,r.q.a)}</span></div><div class="muted" style="margin-top:4px">${r.q.e}</div></div>`).join("")}</section>`:""}`);
 document.getElementById("hm").onclick=home;
 const fx=document.getElementById("fx");if(fx)fx.onclick=()=>go("weak");
 sess=null;
}
const hb=document.getElementById("home");hb.onclick=home;hb.onkeydown=e=>{if(e.key==="Enter")home()};
document.documentElement.lang=STR.lang;
home();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")&&!location.hostname.includes("claudeusercontent")){
 navigator.serviceWorker.register("sw.js").catch(()=>{});
}

</script>

</body></html>
